[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wnyeditpdf"
version = "5.8.1"
description = "โปรแกรมอ่านและแก้ไขไฟล์ PDF ภาษาไทย สำหรับงานเอกสารราชการ (Thai PDF reader & editor)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "See LICENSE and THIRD_PARTY_LICENSES.md" }
keywords = ["pdf", "editor", "thai", "pymupdf", "pyqt6"]

dependencies = [
    "PyQt6>=6.5",
    "PyMuPDF>=1.24",
    "qrcode>=7.4",
    "fonttools>=4.0",
]

[project.scripts]
wnyeditpdf = "wnyeditpdf.window:run"

[tool.setuptools]
packages = ["wnyeditpdf"]

[tool.setuptools.package-data]
wnyeditpdf = ["assets/*", "vendor/**/*"]
